<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Metsis Studio APK</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 1.25rem;
        }

        .download-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.01);
            text-align: center;
        }

        .app-icon {
            width: 76px;
            height: 76px;
            background: linear-gradient(135deg, #3b82f6 0%, var(--primary-color) 100%);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
            box-shadow: 0 8px 16px -4px rgba(37, 99, 235, 0.25);
        }

        .app-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .app-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .btn-download {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.15s ease;
            text-decoration: none;
        }

        .btn-download:hover {
            background-color: var(--primary-hover);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-download:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .meta-info {
            font-size: 0.775rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="download-card">
        <!-- App Icon -->
        <div class="app-icon">
            <i class="bi bi-android2 fs-1 text-white"></i>
        </div>

        <!-- App Information -->
        <h1 class="app-title mb-1">Metsis Studio</h1>
        <p class="app-subtitle mb-4">Official Android App • Direct Download</p>

        <!-- Direct Download Button -->
        <button id="downloadBtn" class="btn btn-download mb-3">
            <i class="bi bi-download"></i> <span id="btnText">Download APK</span>
        </button>

        <div class="meta-info">
            <i class="bi bi-shield-check text-success"></i>
            <span>Verified safe • Instant download</span>
        </div>
    </div>

    <script>
        const apkFileName = 'crelution/metsisstudio.apk';

        document.getElementById('downloadBtn').addEventListener('click', async function() {
            const btn = this;
            const btnText = document.getElementById('btnText');
            
            btn.disabled = true;
            btnText.textContent = 'Starting download...';

            try {
                // Fetch file as raw binary data stream
                const response = await fetch('/' + apkFileName);
                if (!response.ok) throw new Error('File not found');
                
                const blob = await response.blob();
                
                // Force Android package MIME-Type
                const apkBlob = new Blob([blob], { type: 'application/vnd.android.package-archive' });
                const blobUrl = URL.createObjectURL(apkBlob);

                // Create download link with explicit .apk extension
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = apkFileName;
                document.body.appendChild(link);
                link.click();
                
                // Cleanup
                document.body.removeChild(link);
                URL.revokeObjectURL(blobUrl);
            } catch (err) {
                // Fallback to direct navigation if fetch is restricted
                window.location.href = '/' + apkFileName;
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Download APK';
            }
        });
    </script>
</body>
</html>
