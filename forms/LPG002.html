<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Messenger</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- MQTT.js for Real-time WebSockets -->
  <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
  <!-- CryptoJS for AES-256 Encryption & SHA-256 Hashing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body class="bg-dark text-light min-vh-100 d-flex align-items-center justify-content-center">

<div class="container py-4" style="max-width: 440px;">

  <!-- LOGIN SCREEN (Password Only) -->
  <div id="loginCard" class="card bg-secondary text-white shadow">
    <div class="card-body text-center p-4">
      <h3 class="card-title mb-3">🔒 Private Messenger</h3>
      <p class="text-light small mb-4">Enter a shared password on both devices to chat instantly.</p>
      
      <div class="mb-3">
        <input type="password" id="passwordInput" class="form-control form-control-lg text-center" placeholder="Enter Shared Password" onkeypress="if(event.key === 'Enter') startChat()">
      </div>
      
      <button id="connectBtn" class="btn btn-success btn-lg w-100 fw-bold" onclick="startChat()">Start Chatting</button>
      <div id="statusText" class="mt-3 text-warning small d-none">Connecting to secure network...</div>
    </div>
  </div>

  <!-- CHAT WINDOW -->
  <div id="chatCard" class="card bg-secondary text-white shadow d-none">
    <div class="card-header d-flex justify-content-between align-items-center bg-dark text-white border-secondary py-3">
      <div class="d-flex align-items-center">
        <span class="spinner-grow spinner-grow-sm text-success me-2" role="status"></span>
        <span class="fw-bold small">Encrypted Channel</span>
      </div>
      <button class="btn btn-sm btn-outline-danger" onclick="location.reload()">Exit Chat</button>
    </div>
    
    <div class="card-body p-3 bg-dark">
      <div id="chatBox" class="border border-secondary rounded p-3 mb-3 bg-black" style="height: 380px; overflow-y: auto;">
        <div class="text-center text-muted small my-2">Connected. Type a message to begin...</div>
      </div>
      
      <div class="input-group">
        <input type="text" id="messageInput" class="form-control bg-dark text-white border-secondary" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button class="btn btn-primary fw-bold" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

</div>

<script>
  let mqttClient = null;
  let sharedPassword = '';
  let secretTopic = '';

  // Generate a random ID for this session to distinguish sent vs received messages
  const mySessionId = 'user_' + Math.random().toString(36).substring(2, 9);

  function startChat() {
    const pass = document.getElementById('passwordInput').value.trim();
    if (!pass) return alert('Please enter a password!');

    sharedPassword = pass;

    // Show loading state
    document.getElementById('connectBtn').disabled = true;
    document.getElementById('statusText').classList.remove('d-none');

    // Generate secret room topic by hashing the password
    const passwordHash = CryptoJS.SHA256("private_room_" + sharedPassword).toString();
    secretTopic = "chat/room/" + passwordHash;

    // Connect to public MQTT WebSocket broker over TLS
    mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
      clientId: mySessionId,
      clean: true,
      connectTimeout: 8000
    });

    mqttClient.on('connect', () => {
      // Subscribe to secret topic
      mqttClient.subscribe(secretTopic, { qos: 0 }, (err) => {
        if (!err) {
          document.getElementById('loginCard').classList.add('d-none');
          document.getElementById('chatCard').classList.remove('d-none');
        } else {
          alert('Failed to join room. Please try again.');
          location.reload();
        }
      });
    });

    mqttClient.on('message', (topic, message) => {
      if (topic === secretTopic) {
        try {
          // Decrypt payload using the shared password
          const decryptedBytes = CryptoJS.AES.decrypt(message.toString(), sharedPassword);
          const decryptedText = decryptedBytes.toString(CryptoJS.enc.Utf8);

          if (decryptedText) {
            const data = JSON.parse(decryptedText);
            const isSelf = data.senderId === mySessionId;
            appendMessage(data.text, isSelf);
          }
        } catch (e) {
          // Ignores unreadable or corrupted messages
        }
      }
    });

    mqttClient.on('error', (err) => {
      console.error('MQTT Error:', err);
      alert('Network connection error. Refreshing page...');
      location.reload();
    });
  }

  function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text || !mqttClient) return;

    const payload = JSON.stringify({
      senderId: mySessionId,
      text: text
    });

    // Encrypt payload with AES-256 before transmitting
    const encryptedMsg = CryptoJS.AES.encrypt(payload, sharedPassword).toString();

    mqttClient.publish(secretTopic, encryptedMsg);
    input.value = '';
  }

  function appendMessage(text, isSelf) {
    const chatBox = document.getElementById('chatBox');
    const msgDiv = document.createElement('div');
    msgDiv.className = `d-flex mb-2 ${isSelf ? 'justify-content-end' : 'justify-content-start'}`;

    msgDiv.innerHTML = `
      <div class="p-2 px-3 rounded ${isSelf ? 'bg-primary text-white' : 'bg-secondary text-white border border-dark'}" style="max-width: 80%; word-break: break-word;">
        <span>${escapeHtml(text)}</span>
      </div>
    `;

    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>

</body>
</html>
